modLoader = "javafml"
loaderVersion = "[1,)"
license = "All rights reserved"

[[mods]]
modId = "htzcut"
version = "${file.jarVersion}"
displayName = "HTZCut"
authors = "Heytozzz"
description = '''
Dialogue, narration and cinematic events mod for Minecraft, with
event-triggered audio delivery via Simple Voice Chat or HTTP fallback.
'''

[[dependencies.htzcut]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.1,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.htzcut]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.1,1.21.2)"
    ordering = "NONE"
    side = "BOTH"

# Soft depend - LuckPerms mod variant. On hybrid servers, LuckPerms may
# instead be present as a Bukkit plugin, which is detected separately
# at runtime (see permission/PermissionCheckerFactory).
[[dependencies.htzcut]]
    modId = "luckperms"
    type = "optional"
    versionRange = "[5,)"
    ordering = "AFTER"
    side = "BOTH"

# Soft depend - Simple Voice Chat. No versionRange is declared on purpose:
# SVC's version string is prefixed with the Minecraft version it targets
# (e.g. "1.21.1-2.6.21"), which breaks numeric range comparisons and would
# have to be re-tuned for every Minecraft version anyway. Real compatibility
# is checked at runtime via defensive reflection/try-catch (see
# audio/SimpleVoiceChatSupport) rather than gated here. Absent or
# incompatible -> HTTP fallback is used automatically, per player.
[[dependencies.htzcut]]
    modId = "voicechat"
    type = "optional"
    ordering = "AFTER"
    side = "BOTH"
