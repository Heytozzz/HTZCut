# Example event definition. Drop files like this one into this folder;
# HTZCut loads every *.yaml file here on startup.
#
# An event can run multiple "actions" in order when it fires:
#   - sound:     plays an already-registered SoundEvent by its full id
#                (vanilla, another mod's, or HTZCut's own bundled UI
#                sounds once those are registered)
#   - narration: sends a translatable chat message
#   - dialogue:  plays a dynamic .ogg placed in
#                config/htzcut/audios/dialogues/ (routed through Simple
#                Voice Chat when available, or HTZCut's embedded HTTP
#                server as a fallback - just drop the file in, no
#                transcoding step to run manually). Optionally also
#                shows a subtitle box while it plays, in three phases:
#                  1. the box appears (subtitle_box_effect)
#                  2. the text appears (subtitle_text_effect), over
#                     subtitle_text_duration_seconds - either an
#                     entrance animation of the full line, or a
#                     progressive typewriter reveal
#                  3. everything stays up for subtitle_hold_seconds,
#                     then disappears
#                Fields:
#                  subtitle:                       the line to display
#                  subtitle_box_effect:             instant (default),
#                                                    fade_in, bounce,
#                                                    slide_top,
#                                                    slide_bottom,
#                                                    slide_left,
#                                                    slide_right
#                  subtitle_text_effect:            same options as
#                                                    above, plus
#                                                    typewriter_letters
#                                                    and typewriter_words
#                  subtitle_text_duration_seconds:  defaults to 1.5
#                  subtitle_hold_seconds:           defaults to 4
#                  subtitle_position:               bottom (default) or
#                                                    top
#                Leaving subtitle unset skips the box entirely.
#
# Any action can also set delay_seconds: how long to wait, after the
# *previous* action in the list started, before this one runs (not
# relative to the trigger itself - so each action's delay stacks on top
# of the ones before it). Left unset or 0, actions run back-to-back with
# no gap, same as if delay_seconds didn't exist.

id: "welcome_dragon_slain"

trigger:
  type: ADVANCEMENT
  value: "minecraft:end/kill_dragon"

actions:
  - type: sound
    sound: "minecraft:ui.toast.challenge_complete"

  - type: narration
    text_key: "htzcut.narration.dragon_defeated"
    fallback_locale: "en_us"
    delay_seconds: 1

  - type: dialogue
    delay_seconds: 1.5
    audio: "dragon_defeated.ogg"
    subtitle: "At last... the dragon falls."
    subtitle_box_effect: bounce
    subtitle_text_effect: typewriter_letters
    subtitle_text_duration_seconds: 2
    subtitle_hold_seconds: 3
    subtitle_position: bottom

conditions:
  permission: "htzcut.trigger.dragon"
  once_per_player: true
