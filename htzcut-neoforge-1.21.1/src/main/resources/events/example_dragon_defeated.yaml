# Example event definition. Drop files like this one into this folder;
# HTZCut loads every *.yaml file here on startup.
#
# An event can run multiple "actions" in order when it fires:
#   - sound:     plays an already-registered SoundEvent by its full id
#                (vanilla, another mod's, or HTZCut's own bundled UI
#                sounds once those are registered)
#   - narration: sends a translatable chat message
#   - dialogue:  plays a dynamic .ogg from audios/dialogues/ (routed
#                through Simple Voice Chat or the HTTP fallback -
#                HTZCut handles transcoding/caching automatically,
#                nothing technical belongs here)

id: "welcome_dragon_slain"

trigger:
  type: ADVANCEMENT
  value: "minecraft:end/kill_dragon"

actions:
  - type: sound
    sound: "minecraft:ui.toast.challenge_complete"

  - type: narration
    text_key: "htzcut.narration.dragon_defeated"
    fallback_locale: "en_us"

  - type: dialogue
    audio: "dragon_defeated.ogg"

conditions:
  permission: "htzcut.trigger.dragon"
  once_per_player: true
