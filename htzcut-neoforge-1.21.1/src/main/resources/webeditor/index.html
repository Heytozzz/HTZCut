<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HTZCut Editor</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #1e1f22; color: #eee; margin: 0; }
  header { padding: 12px 16px; background: #2b2d31; display: flex; gap: 12px; align-items: center; }
  header h1 { font-size: 16px; margin: 0; flex: 1; }
  input[type=text] { padding: 6px 10px; border-radius: 4px; border: 1px solid #444; background: #1e1f22; color: #eee; width: 220px; }
  .tabs { display: flex; gap: 4px; padding: 8px 16px; background: #26282c; }
  .tab { padding: 6px 14px; border-radius: 4px; cursor: pointer; background: #2b2d31; }
  .tab.active { background: #4c7bd9; }
  .toolbar { display: flex; gap: 8px; align-items: center; padding: 8px 16px; }
  .toolbar button { padding: 4px 10px; border-radius: 4px; border: 1px solid #444; background: #2b2d31; color: #eee; cursor: pointer; }
  .toolbar button.active { background: #4c7bd9; }
  .toolbar button:disabled { opacity: .4; cursor: default; }
  #results { padding: 8px 16px; min-height: 300px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; }
  .grid .entry { display: flex; flex-direction: column; align-items: center; padding: 6px; border-radius: 6px; cursor: pointer; }
  .grid .entry:hover { background: #33353a; }
  .grid .entry img, .grid .entry .noicon { width: 32px; height: 32px; image-rendering: pixelated; }
  .grid .entry span { font-size: 10px; margin-top: 4px; text-align: center; word-break: break-all; }
  .list .entry { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
  .list .entry:hover { background: #33353a; }
  .list .entry img, .list .entry .noicon { width: 24px; height: 24px; image-rendering: pixelated; }
  .noicon { background: #444; border-radius: 3px; }
</style>
</head>
<body>

<header>
  <h1>HTZCut - Selector de recursos</h1>
  <input type="text" id="search" placeholder="Buscar por id o namespace...">
</header>

<div class="tabs">
  <div class="tab active" data-tab="items">Items</div>
  <div class="tab" data-tab="sounds">Sonidos</div>
  <div class="tab" data-tab="advancements">Advancements</div>
</div>

<div class="toolbar">
  <button id="view-grid" class="active">Rejilla</button>
  <button id="view-list">Lista</button>
  <span style="flex:1"></span>
  <button id="prev-page">&laquo; Anterior</button>
  <span id="page-info" style="font-size: 12px; opacity: .8;"></span>
  <button id="next-page">Siguiente &raquo;</button>
</div>

<div id="results"></div>

<script>
const PAGE_SIZE = 96;

let currentTab = "items";
let currentView = "grid";
let currentPage = 0;
let searchDebounce = null;

function iconUrlFor(entryId) {
  const [namespace, path] = entryId.split(":");
  return `/api/icon/item/${namespace}/${path}`;
}

async function fetchPage() {
  const query = document.getElementById("search").value;
  const params = new URLSearchParams({ q: query, page: currentPage, size: PAGE_SIZE });
  const res = await fetch(`/api/registries/${currentTab}?${params}`);
  return res.json();
}

async function render() {
  const container = document.getElementById("results");
  container.className = currentView;

  const data = await fetchPage();
  container.innerHTML = "";

  for (const entry of data.items) {
    const el = document.createElement("div");
    el.className = "entry";
    el.title = entry.id;

    let iconUrl = null;
    if (currentTab === "items") {
      iconUrl = iconUrlFor(entry.id);
    } else if (currentTab === "advancements" && entry.icon) {
      iconUrl = iconUrlFor(entry.icon);
    }

    if (iconUrl) {
      const img = document.createElement("img");
      img.src = iconUrl;
      img.onerror = () => { img.replaceWith(makeNoIcon()); };
      el.appendChild(img);
    } else {
      el.appendChild(makeNoIcon());
    }

    const label = document.createElement("span");
    label.textContent = entry.id;
    el.appendChild(label);

    el.addEventListener("click", () => {
      // For now: copy the id to the clipboard, since this is a
      // standalone picker page - wiring "selecting a value fills in the
      // event YAML field" comes with the full event editor UI.
      navigator.clipboard?.writeText(entry.id);
      el.style.background = "#4c7bd9";
      setTimeout(() => { el.style.background = ""; }, 300);
    });

    container.appendChild(el);
  }

  const totalPages = Math.max(1, Math.ceil(data.total / PAGE_SIZE));
  document.getElementById("page-info").textContent =
      `Página ${currentPage + 1} de ${totalPages} (${data.total} resultado(s))`;
  document.getElementById("prev-page").disabled = currentPage <= 0;
  document.getElementById("next-page").disabled = currentPage >= totalPages - 1;
}

function makeNoIcon() {
  const div = document.createElement("div");
  div.className = "noicon";
  return div;
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentTab = tab.dataset.tab;
    currentPage = 0;
    render();
  });
});

document.getElementById("view-grid").addEventListener("click", () => {
  currentView = "grid";
  document.getElementById("view-grid").classList.add("active");
  document.getElementById("view-list").classList.remove("active");
  render();
});
document.getElementById("view-list").addEventListener("click", () => {
  currentView = "list";
  document.getElementById("view-list").classList.add("active");
  document.getElementById("view-grid").classList.remove("active");
  render();
});

document.getElementById("search").addEventListener("input", () => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    currentPage = 0;
    render();
  }, 250); // avoid hammering the server on every keystroke
});

document.getElementById("prev-page").addEventListener("click", () => {
  currentPage = Math.max(0, currentPage - 1);
  render();
});
document.getElementById("next-page").addEventListener("click", () => {
  currentPage += 1;
  render();
});

render();
</script>

</body>
</html>
